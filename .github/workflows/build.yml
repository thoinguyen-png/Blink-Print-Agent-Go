name: Build Blink Print Agent

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1. Build bản Windows (.exe)
      - name: Build Windows Binary
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H=windowsgui" -o dist/BlinkPrintAgent.exe .

      # 2. Build bản macOS (.app cho Apple Silicon arm64)
      - name: Build macOS Binary & App Bundle
        run: |
          mkdir -p "dist/Blink Print Agent.app/Contents/MacOS"
          mkdir -p "dist/Blink Print Agent.app/Contents/Resources"
          
          # Biên dịch nhị phân cho M1/M2/M3
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o "dist/Blink Print Agent.app/Contents/MacOS/BlinkPrintAgent" .
          chmod +x "dist/Blink Print Agent.app/Contents/MacOS/BlinkPrintAgent"
          
          cd dist
          zip -r "BlinkPrintAgent-macOS.zip" "Blink Print Agent.app"

      # 3. Đẩy file thành phẩm lên GitHub Artifacts
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkPrintAgent-Release
          path: |
            dist/BlinkPrintAgent.exe
            dist/BlinkPrintAgent-macOS.zip