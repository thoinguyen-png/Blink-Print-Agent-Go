name: Build Blink Print Agent

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1. Build Windows (Tắt CGO để cross-compile thuần Go từ macOS sang Windows)
      - name: Build Windows
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H=windowsgui" -o dist/BlinkPrintAgent.exe .

      # 2. Build macOS Universal App (Bật CGO_ENABLED=1 cho systray native Cocoa)
      - name: Build macOS Universal App
        run: |
          mkdir -p "dist/Blink Print Agent.app/Contents/MacOS"
          mkdir -p "dist/Blink Print Agent.app/Contents/Resources"
          
          # Copy Info.plist vào bundle
          cp Info.plist "dist/Blink Print Agent.app/Contents/Info.plist"

          # Build ARM64 (Apple Silicon M1/M2/M3)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/agent_arm64 .
          
          # Build AMD64 (Intel Mac)
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/agent_amd64 .
          
          # Ghép thành Universal Binary chạy mọi máy Mac
          lipo -create -output "dist/Blink Print Agent.app/Contents/MacOS/BlinkPrintAgent" dist/agent_arm64 dist/agent_amd64
          chmod +x "dist/Blink Print Agent.app/Contents/MacOS/BlinkPrintAgent"
          
          # Dọn dẹp và nén file zip chuẩn macOS
          cd dist
          rm agent_arm64 agent_amd64
          zip -ry "BlinkPrintAgent-macOS.zip" "Blink Print Agent.app"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlinkPrintAgent-Release
          path: |
            dist/BlinkPrintAgent.exe
            dist/BlinkPrintAgent-macOS.zip